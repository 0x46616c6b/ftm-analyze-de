name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Lint
        run: uvx ruff check .

      - name: Check formatting
        run: uvx ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build test image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: test
          load: true
          tags: ftm-analyze-de:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests against ftm-analyze and its models
        run: docker run --rm ftm-analyze-de:test

  image:
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read ftm-analyze base version
        id: base
        run: echo "version=$(sed -n 's/^ARG BASE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # release v0.2.0 -> 0.2.0, 0.2, latest and 0.2.0-ftm-analyze-5.3.2; main -> sha-<commit>
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},suffix=-ftm-analyze-${{ steps.base.outputs.version }}
            type=sha,enable=${{ github.event_name == 'push' }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
