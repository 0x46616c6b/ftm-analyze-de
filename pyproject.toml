[project]
name = "ftm-analyze-de"
version = "0.1.0"
description = "German language extension for ftm-analyze: legal entities, public bodies, persons, addresses, phone numbers and register entries in FollowTheMoney documents"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<3.15"
dependencies = [
    "ftm-analyze>=5.3.1,<5.4",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
openaleph = ["ftm-analyze[openaleph]>=5.3.1,<5.4"]

[project.scripts]
ftm-analyze-de = "ftm_analyze_de.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ftm_analyze_de"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
